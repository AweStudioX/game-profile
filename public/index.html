<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Game Profile</title>
  <script src="/dashboard/theme.js"></script>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script type="module" src="/dashboard/app.mjs"></script>
</head>
<body>
  <a class="skip" href="#library">跳到游戏库</a>
  <header class="bar">
    <div class="frame bar-inner"><a class="wordmark" href="/">GAME<span>.</span> PROFILE</a><nav class="bar-actions" aria-label="站点"><div class="theme-picker"></div><a class="private" href="/connect.html">连接平台</a></nav></div>
  </header>
  <main class="frame">
    <div class="catalog-heading">
      <section class="intro home-intro catalog-intro" aria-labelledby="title">
        <p class="eyebrow">PERSONAL GAME LOG</p>
        <h1 id="title">游戏日志<span>.</span></h1>
        <p class="deck">跨平台游戏库、游玩时长与成就。</p>
        <div id="profile-note" class="profile-note" role="status" hidden></div>
      </section>
      <dl class="stats" aria-label="游戏概览" hidden>
        <div><dt>累计已知时长</dt><dd id="hours">—</dd></div>
        <div><dt>游戏</dt><dd id="game-count">—</dd></div>
        <div><dt>已游玩</dt><dd id="played-count">—</dd></div>
        <div><dt>数据来源</dt><dd id="source-count">—</dd></div>
      </dl>
    </div>
    <div id="overview" class="catalog-overview">
      <div id="activity" class="catalog-activity" role="status" hidden></div>
      <ul id="reconnect-notices" class="reconnect-notices" aria-label="平台连接提醒" hidden></ul>
    </div>
    <section id="library" class="library" aria-labelledby="library-title">
      <div class="panel-head library-head"><h2 id="library-title">游戏库</h2><p id="results" class="muted" role="status"></p></div>
      <div class="toolbar" id="toolbar" hidden>
        <div id="filters" class="filters" role="group" aria-label="按来源筛选"></div>
        <div class="tools">
          <label><span class="sr-only">搜索游戏</span><input type="search" id="search" placeholder="搜索游戏"></label>
          <label><span class="sr-only">排序方式</span><select id="sort"><option value="time">游玩时长</option><option value="recent">最近游玩</option><option value="title">游戏名称</option></select></label>
        </div>
      </div>
      <p id="library-status" class="muted" role="status">正在读取游戏库…</p>
      <ul id="games" class="games"></ul>
      <button id="more" class="more" type="button" hidden>显示更多</button>
    </section>
  </main>
  <footer class="frame footer"><span>GAME PROFILE</span><a href="/setup.html">部署与隐私</a></footer>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-header"><div><p class="eyebrow">GAME RECORD</p><h2 id="detail-title"></h2></div><form method="dialog"><button type="submit" autofocus>关闭</button></form></div>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
