  <a class="skip" href="#library">跳到游戏库</a>
  <header class="bar" id="top">
    <div class="frame bar-inner"><a class="wordmark" href="/">GAME<span>.</span> PROFILE</a><nav class="bar-actions" aria-label="站点"><div class="theme-picker"></div><div class="bar-links"><a id="owner-entry" class="login" href="/api/profile?resource=connect-login">登录</a></div></nav></div>
  </header>
  <main class="frame">
    <div class="catalog-heading">
      <section class="intro home-intro catalog-intro" aria-labelledby="title">
        <h1 id="title" lang="en">Game Log<span>.</span></h1>
        <div id="profile-note" class="profile-note" role="status" hidden></div>
      </section>
      <dl class="stats" aria-label="游戏概览" hidden>
        <div><dt>累计已知时长</dt><dd id="hours">—</dd></div>
        <div><dt>游戏</dt><dd id="game-count">—</dd></div>
        <div><dt>已游玩</dt><dd id="played-count">—</dd></div>
        <div><dt>数据来源</dt><dd id="source-count">—</dd></div>
      </dl>
    </div>
    <section id="identities" class="identities" aria-label="平台账号" hidden>
      <ul id="identity-list" class="identity-list"></ul>
    </section>
    <div id="overview" class="catalog-overview">
      <section aria-labelledby="live-title">
        <div class="panel-head"><h2 id="live-title">正在游玩</h2><span id="activity-status" class="badge">读取中</span></div>
        <div id="activity" class="catalog-activity" role="status"><p class="loading-lines">正在读取当前活动…</p></div>
      </section>
      <section aria-labelledby="source-title">
        <h2 id="source-title">游戏库同步</h2>
        <ul id="sources" class="sources" aria-live="polite"><li class="loading-lines">正在读取平台状态…</li><li class="loading-lines" aria-hidden="true"></li><li class="loading-lines" aria-hidden="true"></li></ul>
        <p class="muted">按平台计数，跨平台游戏可重复。</p>
      </section>
    </div>
    <section id="library" class="library" aria-labelledby="library-title">
      <div class="panel-head library-head"><h2 id="library-title">游戏库</h2><p id="results" class="muted" role="status"></p></div>
      <div class="toolbar" id="toolbar" hidden>
        <div id="filters" class="filters" role="group" aria-label="按来源筛选">
          <button disabled>全部</button><button disabled>Nintendo</button><button disabled>PlayStation</button><button disabled>Steam</button>
        </div>
        <div class="tools">
          <label class="library-search">
            <span class="sr-only">搜索游戏</span>
            <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input type="search" id="search" placeholder="搜索游戏">
          </label>
          <label><span class="sr-only">排序方式</span><select id="sort"><option value="time">游玩时长</option><option value="recent">最近游玩</option><option value="title">游戏名称</option></select></label>
        </div>
      </div>
      <p id="library-status" class="muted" role="status">正在读取游戏库…</p>
      <ul id="games" class="games"></ul>
      <button id="more" class="more" type="button" hidden>显示更多</button>
    </section>
  </main>
