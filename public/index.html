<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Game Profile</title>
  <script src="/dashboard/theme.js"></script>
  <link rel="stylesheet" href="/dashboard/style.css">
  <script type="module" src="/dashboard/app.mjs"></script>
  <script type="module" src="/dashboard/footer.mjs"></script>
</head>
<body>
  <a class="skip" href="#library">跳到游戏库</a>
  <header class="bar" id="top">
    <div class="frame bar-inner"><a class="wordmark" href="/">GAME<span>.</span> PROFILE</a><nav class="bar-actions" aria-label="站点"><div class="theme-picker"></div><div class="bar-links"><a id="owner-entry" class="login" href="/api/profile?resource=connect-login">登录</a></div></nav></div>
  </header>
  <main class="frame">
    <div class="catalog-heading">
      <section class="intro home-intro catalog-intro" aria-labelledby="title">
        <h1 id="title" lang="en">Game Log<span>.</span></h1>
        <div id="profile-note" class="profile-note" role="status" hidden></div>
      </section>
      <dl class="stats" aria-label="游戏概览" hidden>
        <div><dt>累计已知时长</dt><dd id="hours">—</dd></div>
        <div><dt>游戏</dt><dd id="game-count">—</dd></div>
        <div><dt>已游玩</dt><dd id="played-count">—</dd></div>
        <div><dt>数据来源</dt><dd id="source-count">—</dd></div>
      </dl>
    </div>
    <section id="identities" class="identities" aria-label="平台账号" hidden>
      <ul id="identity-list" class="identity-list"></ul>
    </section>
    <div id="overview" class="catalog-overview">
      <section aria-labelledby="live-title">
        <div class="panel-head"><h2 id="live-title">正在游玩</h2><span id="activity-status" class="badge">读取中</span></div>
        <div id="activity" class="catalog-activity" role="status"><p class="loading-lines">正在读取当前活动…</p></div>
      </section>
      <section aria-labelledby="source-title">
        <h2 id="source-title">游戏库同步</h2>
        <ul id="sources" class="sources" aria-live="polite"><li class="loading-lines">正在读取平台状态…</li><li class="loading-lines" aria-hidden="true"></li><li class="loading-lines" aria-hidden="true"></li></ul>
        <p class="muted">按平台计数，跨平台游戏可重复。</p>
      </section>
    </div>
    <section id="library" class="library" aria-labelledby="library-title">
      <div class="panel-head library-head"><h2 id="library-title">游戏库</h2><p id="results" class="muted" role="status"></p></div>
      <div class="toolbar" id="toolbar" hidden>
        <div id="filters" class="filters" role="group" aria-label="按来源筛选">
          <button disabled>全部</button><button disabled>Nintendo</button><button disabled>PlayStation</button><button disabled>Steam</button>
        </div>
        <div class="tools">
          <label class="library-search">
            <span class="sr-only">搜索游戏</span>
            <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input type="search" id="search" placeholder="搜索游戏">
          </label>
          <label><span class="sr-only">排序方式</span><select id="sort"><option value="time">游玩时长</option><option value="recent">最近游玩</option><option value="title">游戏名称</option></select></label>
        </div>
      </div>
      <p id="library-status" class="muted" role="status">正在读取游戏库…</p>
      <ul id="games" class="games"></ul>
      <button id="more" class="more" type="button" hidden>显示更多</button>
    </section>
  </main>
  <footer class="frame footer">
    <p id="sticker-help" class="sr-only">可拖动贴纸。键盘方向键移动，回车归位，Escape 取消当前拖动。</p>
    <div class="footer-collage" data-footer-collage role="group" aria-label="游戏贴纸" aria-describedby="sticker-help">
      <button class="footer-sticker" type="button" aria-label="DualSense 手柄贴纸"><img src="/dashboard/stickers/01.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="Xbox Series X 贴纸"><img src="/dashboard/stickers/02.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="Nintendo Switch 贴纸"><img src="/dashboard/stickers/03.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="PlayStation 5 Pro 贴纸"><img src="/dashboard/stickers/04.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="Game Boy 贴纸"><img src="/dashboard/stickers/05.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="光盘贴纸"><img src="/dashboard/stickers/06.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="游戏卡带贴纸"><img src="/dashboard/stickers/07.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
      <button class="footer-sticker" type="button" aria-label="PlayStation 4 贴纸"><img src="/dashboard/stickers/08.webp" alt="" width="512" height="512" loading="lazy" decoding="async" draggable="false"></button>
    </div>
    <div class="footer-meta">
      <div class="footer-mark">
        <div><p class="footer-title" lang="en">KEEP PLAYING<span>.</span></p><span class="footer-caption">GAME PROFILE</span></div>
      </div>
      <div class="footer-end">
        <a class="footer-return" href="#top"><span>回到顶部</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></a>
        <a class="footer-credit" href="/dashboard/stickers/credits.json">素材来源</a>
      </div>
    </div>
  </footer>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-header"><div><p class="eyebrow">GAME RECORD</p><h2 id="detail-title"></h2></div><form method="dialog"><button type="submit" autofocus>关闭</button></form></div>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
